<div class="full media">
  <div class="kiri">
    <div class="kiriatas cd-card cd-brand d-flex flex-column justify-content-center">
      <div class="text-center boxLogo m-0"></div>
      <div>
        <!-- <h4 class="text-center dm-serif-text-regular m-0 namaPT"></h4> -->
        <p class="text-center dm-serif-text-regular header m-0 namaPT cd-name">Mocha Display</p>
        <p class="text-center national-park m-0 cd-slogan" id="slogan">More Than Trusted</p>
      </div>
    </div>
    <div class="kiritengah cd-media" id="boxCarousel">
    </div>
    <div class="kiribawah cd-footer d-flex justify-content-center align-items-center">
      <p class="h4 national-park m-0 text-center d-none" id="footer"></p>
      <div id="footerScroll" class="cd-ticker h4 m-0 national-park d-none"><span class="cd-ticker-inner"></span></div>
    </div>
  </div>
  <div class="kanan cd-card cd-board">
    <div class="card-header d-flex justify-content-between cd-board-head">
      <h5 class="national-park nowrap cd-board-title">Today's Rate</h5>
      <div class="d-flex p-0 gap-2 boxSetup">
        <div class="input-group input-group-sm p-0">
          <span class="input-group-text">Max Rows</span>
          <input type="number" id="maxRows" class="form-control" placeholder="Input Max Rows" min="1" value="10">
        </div>
        <div class="d-flex p-0">
          <button id="fontMinus" class="btn btn-sm btn-outline-primary">A-</button>
          <button id="fontPlus" class="btn btn-sm btn-outline-primary">A+</button>
        </div>
      </div>
      <h5 class="national-park nowrap cd-clock" id="nowDate"></h5>
    </div>
    <div class="card-body overflow-auto">
      <div id="tabelContainer" class="d-flex flex-wrap gap-3"></div>
    </div>
  </div>
</div>

<script src="/js/customer-display/footer.js"></script>
<script src="/js/customer-display/default.js"></script>
