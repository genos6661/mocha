<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9c3030">
  <title>Offline - BERES Mocha</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #4a3b3b;
      background: radial-gradient(60rem 30rem at 50% -10rem, rgba(156, 48, 48, 0.16), transparent 70%), #fdf8f1;
    }
    .card {
      width: 100%;
      max-width: 24rem;
      padding: 2.25rem 2rem;
      text-align: center;
      border-radius: 1.5rem;
      background: #fff;
      box-shadow: 0 1rem 2.5rem -1.5rem rgba(60, 20, 20, 0.45);
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.25rem;
      border-radius: 1.4rem;
      background: linear-gradient(135deg, #9c3030, #5e1d1d);
      box-shadow: 0 0.9rem 1.75rem -0.7rem rgba(156, 48, 48, 0.75);
    }
    .logo img { width: 2.6rem; height: 2.6rem; filter: brightness(0) invert(1); }
    h1 { margin: 0 0 0.5rem; font-size: 1.4rem; }
    p { margin: 0 0 1.5rem; color: #8a7676; line-height: 1.5; }
    button {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 0.6rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: #9c3030;
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><img src="/assets/img/favicon/logo.svg" alt=""></div>
    <h1>You're offline</h1>
    <p>BERES Mocha needs an internet connection. Please check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
